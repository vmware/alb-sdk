definitions:
    ApplicationInsightsParams:
        type: object
        properties:
            enable_learn_from_bots:
                description: "If set to true, limit application learning only from clients which match the learn_from_bots specification. The settings learn_from_authenticated_clients_only and trusted_ip_groups always take precedence. Field introduced in 31.2.1. Allowed with any value in Enterprise, Essentials, Basic, Enterprise with Cloud Services edition."
                type: boolean
            enable_per_uri_learning:
                description: "If true, learns the params per URI path. Field introduced in 31.2.1. Allowed with any value in Enterprise, Essentials, Basic, Enterprise with Cloud Services edition."
                type: boolean
                default: True
            learn_from_authenticated_clients_only:
                description: "Limit Application Learning only from Authenticated clients. Field introduced in 31.2.1. Allowed with any value in Enterprise, Essentials, Basic, Enterprise with Cloud Services edition."
                type: boolean
            learn_from_bots:
                description: "If Bot detection is active for this Virtual Service, learning will only be performed on application data from clients within the configured bot classification types. Field introduced in 31.2.1. Allowed with any value in Enterprise, Essentials, Basic, Enterprise with Cloud Services edition."
                $ref: '#/definitions/BotDetectionMatch'
            learn_from_urls_without_args:
                description: "When true, the WAF includes argument-less URIs in its learning process. Field introduced in 31.2.1. Allowed with any value in Enterprise, Essentials, Basic, Enterprise with Cloud Services edition."
                type: boolean
            max_params:
                description: "Maximum number of parameters per URI programmed for Application Insights. Allowed values are 10-1000. Field introduced in 31.2.1. Allowed with any value in Enterprise, Essentials, Basic, Enterprise with Cloud Services edition."
                type: integer
                default: 100
                format: uint32
            max_uris:
                description: "Maximum number of URIs for Application Insights. Allowed values are 10-10000. Field introduced in 31.2.1. Allowed with any value in Enterprise, Essentials, Basic, Enterprise with Cloud Services edition."
                type: integer
                default: 500
                format: uint32
            trusted_ipgroup_ref:
                description: "Limits Application Learning from client IPs within the configured IP Address Group. It is a reference to an object of type IpAddrGroup. Field introduced in 31.2.1. Allowed with any value in Enterprise, Essentials, Basic, Enterprise with Cloud Services edition."
                type: string
    ApplicationInsightsPolicy:
        type: object
        required:
            -   name
        properties:
            _last_modified:
                description: "UNIX time since epoch in microseconds. Units(MICROSECONDS)."
                readOnly: True
                type: string
            application_insights_params:
                description: "Application insights parameters to filter application learning from clients. Field introduced in 31.2.1. Allowed with any value in Enterprise, Essentials, Basic, Enterprise with Cloud Services edition."
                $ref: '#/definitions/ApplicationInsightsParams'
            application_sampling_config:
                description: "Application sampling configuration to control rate and volume of data ingestion for Application Insights that the ServiceEngines are expected to send to the controller. Field introduced in 31.2.1. Allowed with any value in Enterprise, Essentials, Basic, Enterprise with Cloud Services edition."
                $ref: '#/definitions/ApplicationSamplingConfig'
            description:
                description: "Details of the Application Insights Configuration. Field introduced in 31.2.1. Allowed with any value in Enterprise, Essentials, Basic, Enterprise with Cloud Services edition."
                type: string
            enable_application_insights:
                description: "Enable Application Insights, formerly called learning for this virtual service. Field introduced in 31.2.1. Allowed with any value in Enterprise, Essentials, Basic, Enterprise with Cloud Services edition."
                type: boolean
            name:
                description: "The name of the Application Insights Configuration. Field introduced in 31.2.1. Allowed with any value in Enterprise, Essentials, Basic, Enterprise with Cloud Services edition."
                type: string
            tenant_ref:
                description: "Details of the Tenant for the Application Insights Configuration. It is a reference to an object of type Tenant. Field introduced in 31.2.1. Allowed with any value in Enterprise, Essentials, Basic, Enterprise with Cloud Services edition."
                type: string
            url:
                description: "url"
                readOnly: True
                type: string
            uuid:
                description: "UUID of the Application Insights Configuration. Field introduced in 31.2.1. Allowed with any value in Enterprise, Essentials, Basic, Enterprise with Cloud Services edition."
                type: string
    ApplicationInsightsPolicyApiResponse:
        type: object
        required:
            - count
            - results
        properties:
            count:
                type: integer
                format: int32
            results:
                type: array
                items:
                    $ref: "#/definitions/ApplicationInsightsPolicy"
            next:
                type: string
    ApplicationSamplingConfig:
        type: object
        properties:
            max_sampling_percent:
                description: "Maximum percent of the application data subjected to Application learning. Allowed values are 1-100. Field introduced in 31.2.1. Unit is PERCENT. Allowed with any value in Enterprise, Essentials, Basic, Enterprise with Cloud Services edition."
                type: integer
                default: 1
                format: uint32
            min_update_interval:
                description: "Minimum periodicity at which ServiceEngine sends the application data to the controller. Allowed values are 1-60. Field introduced in 31.2.1. Unit is MIN. Allowed with any value in Enterprise, Essentials, Basic, Enterprise with Cloud Services edition."
                type: integer
                default: 30
                format: uint32
    BotClassification:
        type: object
        required:
            -   type
        properties:
            type:
                description: "One of the system-defined Bot classification types. Enum options - HUMAN, GOOD_BOT, BAD_BOT, DANGEROUS_BOT, USER_DEFINED_BOT, UNKNOWN_CLIENT. Field introduced in 21.1.1. Allowed with any value in Enterprise, Essentials, Basic, Enterprise with Cloud Services edition."
                type: string
            user_defined_type:
                description: "If 'type' has BotClassificationTypes value 'USER_DEFINED', this is the user-defined value. Field introduced in 21.1.1. Allowed with any value in Enterprise, Essentials, Basic, Enterprise with Cloud Services edition."
                type: string
    BotDetectionMatch:
        type: object
        required:
            -   match_operation
        properties:
