                type: integer
                default: 9000
                format: uint32
            confid_very_high_value:
                description: "Confidence threshold for label CONFIDENCE_VERY_HIGH. Field introduced in 18.2.3. Allowed with any value in Enterprise, Essentials, Basic, Enterprise with Cloud Services edition."
                type: integer
                default: 9999
                format: uint32
    ConfigPbAttributes:
        type: object
