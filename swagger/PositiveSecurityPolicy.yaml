                default: 500
                format: uint32
            min_confidence:
                description: "Minimum confidence label required for positive security rule updates. Enum options - CONFIDENCE_VERY_HIGH, CONFIDENCE_HIGH, CONFIDENCE_PROBABLE, CONFIDENCE_LOW, CONFIDENCE_NONE. Field introduced in 31.2.1. Allowed with any value in Enterprise, Enterprise with Cloud Services edition."
