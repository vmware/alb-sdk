    UserAgentCacheConfig:
        type: object
        properties:
            batch_size:
                description: "How many unknown User-Agents to batch up before querying Controller - unless max_wait_time is reached first. Allowed values are 1-500. Field introduced in 21.1.1. Allowed with any value in Enterprise, Essentials, Basic, Enterprise with Cloud Services edition."
                type: integer
                default: 100
                format: uint32
            controller_cache_size:
                description: "The number of User-Agent entries to cache on the Controller. Allowed values are 500-10000000. Field introduced in 21.1.1. Allowed with any value in Enterprise, Essentials, Basic, Enterprise with Cloud Services edition."
                type: integer
                default: 300000
                format: uint32
            max_age:
                description: "Time interval in seconds after which an existing entry is refreshed from upstream if it has been accessed during max_last_hit_time. Allowed values are 60-604800. Field introduced in 22.1.1. Allowed with any value in Enterprise, Essentials, Basic, Enterprise with Cloud Services edition."
                type: integer
                default: 86400
                format: uint32
            max_last_hit_time:
                description: "Time interval in seconds backwards from now during which an existing entry must have been hit for refresh from upstream. Entries that have last been accessed further in the past than max_last_hit time are not included in upstream refresh requests even if they are older than 'max_age'. Allowed values are 60-604800. Field introduced in 22.1.1. Allowed with any value in Enterprise, Essentials, Basic, Enterprise with Cloud Services edition."
                type: integer
                default: 86400
                format: uint32
            max_upstream_queries:
                description: "How often at most to query controller for a given User-Agent. Allowed values are 2-100. Field introduced in 21.1.1. Allowed with any value in Enterprise, Essentials, Basic, Enterprise with Cloud Services edition."
                type: integer
                default: 5
                format: uint32
            max_wait_time:
                description: "The time interval in seconds after which to make a request to the Controller, even if the 'batch_size' hasn't been reached yet. Allowed values are 20-100000. Field introduced in 21.1.1. Unit is SEC. Allowed with any value in Enterprise, Essentials, Basic, Enterprise with Cloud Services edition."
                type: integer
                default: 60
                format: uint32
            num_entries_upstream_update:
                description: "How many BotUACacheResult elements to include in an upstream update message. Allowed values are 1-10000. Field introduced in 21.1.1. Allowed with any value in Enterprise, Essentials, Basic, Enterprise with Cloud Services edition."
                type: integer
                default: 100
                format: uint32
            percent_reserved_for_bad_bots:
                description: "How much space to reserve in percent for known bad bots. Field introduced in 21.1.1. Allowed with any value in Enterprise, Essentials, Basic, Enterprise with Cloud Services edition."
                type: integer
                default: 20
                format: uint32
            percent_reserved_for_browsers:
                description: "How much space to reserve in percent for browsers. Field introduced in 21.1.1. Allowed with any value in Enterprise, Essentials, Basic, Enterprise with Cloud Services edition."
                type: integer
                default: 50
                format: uint32
            percent_reserved_for_good_bots:
                description: "How much space to reserve in percent for known good bots. Field introduced in 21.1.1. Allowed with any value in Enterprise, Essentials, Basic, Enterprise with Cloud Services edition."
                type: integer
                default: 20
                format: uint32
            percent_reserved_for_outstanding:
                description: "How much space to reserve in percent for outstanding upstream requests. Field introduced in 21.1.1. Allowed with any value in Enterprise, Essentials, Basic, Enterprise with Cloud Services edition."
                type: integer
                default: 10
                format: uint32
            se_cache_size:
                description: "The number of User-Agent entries to cache on each Service Engine. Allowed values are 500-10000000. Field introduced in 21.1.1. Allowed with any value in Enterprise, Essentials, Basic, Enterprise with Cloud Services edition."
                type: integer
                default: 20000
                format: uint32
            upstream_update_interval:
                description: "How often in seconds to send updates about User-Agent cache entries to the next upstream cache. Field introduced in 21.1.1. Unit is SEC. Allowed with any value in Enterprise, Essentials, Basic, Enterprise with Cloud Services edition."
                type: integer
                default: 3600
                format: uint32
